<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saved Sessions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="/">🎥 Detection</a>
        <a href="/analytics">📊 Analytics</a>
        <a href="/history">📈 History</a>
        <a href="/sessions_list" class="active">📁 Sessions</a>
        <a href="/settings">⚙️ Settings</a>
    </div>
    <div class="nav-right">
        <a href="#" id="darkToggle" title="Toggle dark mode">🌙</a>
    </div>
</div>

<div class="container">
    <h1>📁 Saved Sessions</h1>
    <div id="sessionsList"></div>
</div>

<script>
async function loadSessions() {
    try {
        const resp = await fetch('/api/sessions');
        const sessions = await resp.json();
        const container = document.getElementById('sessionsList');
        
        if (sessions.length === 0) {
            container.innerHTML = '<div class="empty">No saved sessions yet</div>';
            return;
        }
        
        container.innerHTML = '';
        sessions.forEach(session => {
            const date = new Date(session.start_time).toLocaleString();
            const div = document.createElement('div');
            div.className = 'session-item';
            div.innerHTML = `
                <div class="session-info">
                    <div class="session-name">${session.filename}</div>
                    <div class="session-meta">
                        Started: ${date} | Detections: ${session.total_detections}
                    </div>
                </div>
                <div class="session-actions">
                    <a href="/sessions/${session.filename}" class="btn btn-download">⬇️ Download JSON</a>
                    <button class="btn btn-pdf" onclick="downloadPDFReport('${session.filename}')">📄 PDF Report</button>
                    <button class="btn btn-delete" onclick="deleteSession('${session.filename}')">🗑️ Delete</button>
                </div>
            `;
            container.appendChild(div);
        });
    } catch (error) {
        document.getElementById('sessionsList').innerHTML = '<div class="empty">Error loading sessions</div>';
    }
}

async function deleteSession(filename) {
    if (confirm(`Delete ${filename}?`)) {
        try {
            await fetch(`/api/sessions/${filename}`, { method: 'DELETE' });
            loadSessions();
        } catch (error) {
            alert('Delete failed: ' + error.message);
        }
    }
}

function downloadPDFReport(filename) {
    
    window.open(`/api/generate_report/${filename}`, '_blank');
}

function initDarkToggle(){
    const saved = localStorage.getItem('darkMode');
    const enabled = saved === '1';
    if (enabled) document.body.classList.add('dark');
    const toggle = document.getElementById('darkToggle');
    if (toggle) {
        toggle.innerText = enabled ? '☀️' : '🌙';
        toggle.addEventListener('click', (e)=>{ e.preventDefault(); const isDark = document.body.classList.toggle('dark'); localStorage.setItem('darkMode', isDark ? '1':'0'); toggle.innerText = isDark ? '☀️':'🌙'; });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadSessions();
    initDarkToggle();
});

setInterval(loadSessions, 3000);
</script>
<script src="/static/script.js"></script>
</body>
</html>
